# Identidad, versión y dependencias del proyecto Flutter.
name: keki_keki
description: Keki Keki - Pastelería Inteligente. Tienda del cliente y gestión de pedidos con Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Paquetes usados por la aplicación y las pruebas.
dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # Habilita los iconos de Material usados por las pantallas.
  uses-material-design: true

  # Fotos de los productos (versiones livianas; los originales están en
  # fotos_originales/, que no se incluye en la app).
  assets:
    - assets/productos/

# Logo de la app (pingüino con torta). Para regenerar los íconos de Android e
# iOS después de cambiar assets/icon/app_icon.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # Android 8+ recorta el ícono en distintas formas: fondo rosado del logo y
  # el dibujo un poco más pequeño para que no se corte.
  adaptive_icon_background: "#FFC8E6"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 16
