# Identidad, versión y dependencias del proyecto Flutter.
name: keki_keki
description: Keki Keki - Pastelería Inteligente. Tienda del cliente y gestión de pedidos con Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Paquetes usados por la aplicación y las pruebas.
dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # Habilita los iconos de Material usados por las pantallas.
  uses-material-design: true
